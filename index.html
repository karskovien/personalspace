<style>
:root{--ac:#173F32;--acr:23,63,50;--bg:#F8F9F6;--bg2:#F2F4F0;--ink:#102D24;--tx:#102D24;--fg:var(--ac);--em:var(--ac);--mut:var(--tx);--gdk:rgba(var(--acr),var(--ai,.92));--g1:rgba(255,255,255,.55);--g2:rgba(255,255,255,.68);--g3:rgba(255,255,255,.88);--gt:rgba(var(--acr),.07);--bd:rgba(255,255,255,.85);--ln:rgba(var(--acr),.12);--sh:0 8px 28px rgba(16,45,36,.06);--bl:20px;--am:1;--e1:cubic-bezier(.22,1,.36,1);--e2:cubic-bezier(.16,1,.3,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.card:hover .cap,.card:focus-within .cap{opacity:1;transform:none}@media(hover:none){.cap{opacity:1;transform:none}.cap small{display:none}}
